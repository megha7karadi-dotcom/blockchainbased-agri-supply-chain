<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgRetail" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff" />
      <stop offset="100%" stop-color="#f3e8ff" />
    </linearGradient>
    <linearGradient id="shelfGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="shelfShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#581c87" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" fill="url(#bgRetail)" rx="24" />

  <!-- Market Shelf Stand -->
  <g transform="translate(60, 90)" filter="url(#shelfShadow)">
    <!-- Back panel with wood slats -->
    <rect x="0" y="0" width="480" height="290" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
    <line x1="0" y1="70" x2="480" y2="70" stroke="#e2e8f0" stroke-width="1.5" />
    <line x1="0" y1="140" x2="480" y2="140" stroke="#e2e8f0" stroke-width="1.5" />
    <line x1="0" y1="210" x2="480" y2="210" stroke="#e2e8f0" stroke-width="1.5" />

    <!-- Top Aisle Banner -->
    <rect x="0" y="0" width="480" height="50" rx="16" fill="#065f46" />
    <rect x="0" y="24" width="480" height="26" fill="#065f46" />
    <text x="240" y="32" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">FRESHROOT CERTIFIED ORGANICS</text>

    <!-- Shelf 1 (Produce Bins) -->
    <rect x="20" y="115" width="440" height="14" rx="4" fill="url(#shelfGrad)" stroke="#94a3b8" stroke-width="1.5" />
    
    <!-- Produce bin 1: Apples -->
    <g transform="translate(40, 65)">
      <circle cx="20" cy="30" r="16" fill="#ef4444" />
      <circle cx="45" cy="30" r="16" fill="#dc2626" />
      <circle cx="70" cy="30" r="16" fill="#ef4444" />
      <circle cx="32" cy="15" r="15" fill="#f87171" />
      <circle cx="58" cy="15" r="15" fill="#ef4444" />
      <!-- Digital Price Tag -->
      <rect x="15" y="52" width="70" height="24" rx="4" fill="#0f172a" />
      <text x="50" y="68" font-family="Inter, monospace" font-size="10" font-weight="bold" fill="#34d399" text-anchor="middle">₹160/kg</text>
    </g>

    <!-- Produce bin 2: Mangoes -->
    <g transform="translate(190, 65)">
      <circle cx="20" cy="30" r="17" fill="#f59e0b" />
      <circle cx="46" cy="30" r="17" fill="#fbbf24" />
      <circle cx="72" cy="30" r="17" fill="#f59e0b" />
      <circle cx="33" cy="15" r="16" fill="#fbbf24" />
      <circle cx="59" cy="15" r="16" fill="#f59e0b" />
      <!-- Digital Price Tag -->
      <rect x="15" y="52" width="70" height="24" rx="4" fill="#0f172a" />
      <text x="50" y="68" font-family="Inter, monospace" font-size="10" font-weight="bold" fill="#34d399" text-anchor="middle">₹195/kg</text>
    </g>

    <!-- Produce bin 3: Avocados / Greens -->
    <g transform="translate(340, 65)">
      <circle cx="20" cy="30" r="16" fill="#15803d" />
      <circle cx="45" cy="30" r="16" fill="#16a34a" />
      <circle cx="70" cy="30" r="16" fill="#15803d" />
      <circle cx="32" cy="15" r="15" fill="#22c55e" />
      <circle cx="58" cy="15" r="15" fill="#15803d" />
      <!-- Digital Price Tag -->
      <rect x="15" y="52" width="70" height="24" rx="4" fill="#0f172a" />
      <text x="50" y="68" font-family="Inter, monospace" font-size="10" font-weight="bold" fill="#34d399" text-anchor="middle">₹220/kg</text>
    </g>

    <!-- Shelf 2 (Lower shelf with packaging boxes & QR signs) -->
    <rect x="20" y="235" width="440" height="14" rx="4" fill="url(#shelfGrad)" stroke="#94a3b8" stroke-width="1.5" />
    
    <g transform="translate(40, 160)">
      <rect x="0" y="10" width="120" height="65" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
      <rect x="12" y="20" width="40" height="40" rx="4" fill="#0f172a" />
      <rect x="16" y="24" width="10" height="10" fill="#34d399" />
      <text x="60" y="32" font-family="Inter, sans-serif" font-size="9" font-weight="bold" fill="#0f172a">Origin QR</text>
      <text x="60" y="45" font-family="Inter, sans-serif" font-size="7.5" fill="#64748b">Verified Organic</text>
      <text x="60" y="58" font-family="Inter, sans-serif" font-size="7.5" fill="#059669">GI-139 Batch</text>
    </g>

    <g transform="translate(180, 160)">
      <rect x="0" y="10" width="120" height="65" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
      <rect x="12" y="20" width="40" height="40" rx="4" fill="#0f172a" />
      <rect x="16" y="24" width="10" height="10" fill="#34d399" />
      <text x="60" y="32" font-family="Inter, sans-serif" font-size="9" font-weight="bold" fill="#0f172a">Origin QR</text>
      <text x="60" y="45" font-family="Inter, sans-serif" font-size="7.5" fill="#64748b">Direct from Farmer</text>
      <text x="60" y="58" font-family="Inter, sans-serif" font-size="7.5" fill="#059669">Zero Pesticide</text>
    </g>

    <g transform="translate(320, 160)">
      <rect x="0" y="10" width="120" height="65" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
      <rect x="12" y="20" width="40" height="40" rx="4" fill="#0f172a" />
      <rect x="16" y="24" width="10" height="10" fill="#34d399" />
      <text x="60" y="32" font-family="Inter, sans-serif" font-size="9" font-weight="bold" fill="#0f172a">Origin QR</text>
      <text x="60" y="45" font-family="Inter, sans-serif" font-size="7.5" fill="#64748b">Fair Payout</text>
      <text x="60" y="58" font-family="Inter, sans-serif" font-size="7.5" fill="#059669">Audited Price</text>
    </g>
  </g>
</svg>
