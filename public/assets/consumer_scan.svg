<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgScan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff" />
      <stop offset="100%" stop-color="#f5f3ff" />
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="scanShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4c1d95" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" fill="url(#bgScan)" rx="24" />

  <!-- Packaging Crate/Box on Left -->
  <g transform="translate(80, 120)">
    <rect x="0" y="40" width="180" height="220" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
    <!-- Produce label -->
    <rect x="20" y="60" width="140" height="60" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
    <text x="90" y="85" font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">ORGANIC HAPUS</text>
    <text x="90" y="102" font-family="Inter, sans-serif" font-size="9" font-weight="500" fill="#166534" text-anchor="middle">Ratnagiri GI-139 Certified</text>

    <!-- Large QR Code on packaging -->
    <rect x="40" y="140" width="100" height="100" rx="10" fill="#0f172a" />
    <!-- QR Reticles -->
    <rect x="52" y="152" width="24" height="24" fill="#ffffff" />
    <rect x="56" y="156" width="16" height="16" fill="#0f172a" />
    <rect x="104" y="152" width="24" height="24" fill="#ffffff" />
    <rect x="108" y="156" width="16" height="16" fill="#0f172a" />
    <rect x="52" y="204" width="24" height="24" fill="#ffffff" />
    <rect x="56" y="208" width="16" height="16" fill="#0f172a" />
    <rect x="94" y="194" width="10" height="10" fill="#10b981" />
    <rect x="110" y="210" width="14" height="14" fill="#10b981" />
  </g>

  <!-- Laser Beam from Phone to QR code -->
  <polygon points="260,210 140,150 140,230 260,250" fill="#10b981" opacity="0.2" />
  <line x1="260" y1="230" x2="140" y2="190" stroke="#10b981" stroke-width="2" stroke-dasharray="4 2" />

  <!-- Smartphone Scanning Device on Right -->
  <g transform="translate(300, 60)" filter="url(#scanShadow)">
    <!-- Phone Bezel -->
    <rect x="0" y="0" width="210" height="340" rx="32" fill="url(#phoneGrad)" stroke="#475569" stroke-width="3" />
    <!-- Phone Screen -->
    <rect x="10" y="14" width="190" height="312" rx="22" fill="#ffffff" />

    <!-- Speaker Notch -->
    <rect x="75" y="6" width="60" height="5" rx="2.5" fill="#334155" />

    <!-- App Viewport Header -->
    <rect x="10" y="14" width="190" height="42" rx="22" fill="#065f46" />
    <rect x="10" y="36" width="190" height="20" fill="#065f46" />
    <text x="105" y="38" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">AgriTrace Verified</text>

    <!-- Scan result inside phone -->
    <g transform="translate(22, 68)">
      <!-- Checkmark circle -->
      <circle cx="20" cy="20" r="16" fill="#d1fae5" />
      <path d="M14 20 L18 24 L27 15" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="44" y="16" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Authenticity Confirmed</text>
      <text x="44" y="28" font-family="Inter, monospace" font-size="8.5" font-weight="600" fill="#059669">Smart Contract Verified</text>

      <!-- Mini Price Transparency Breakdown -->
      <rect x="0" y="45" width="166" height="96" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <text x="12" y="64" font-family="Inter, sans-serif" font-size="8.5" font-weight="bold" fill="#64748b">FARM-TO-FORK BREAKDOWN</text>
      
      <text x="12" y="82" font-family="Inter, sans-serif" font-size="9" fill="#334155">Farmer Share:</text>
      <text x="154" y="82" font-family="Inter, sans-serif" font-size="9" font-weight="bold" fill="#047857" text-anchor="end">₹120 (61.5%)</text>

      <text x="12" y="98" font-family="Inter, sans-serif" font-size="9" fill="#334155">Cold Logistics:</text>
      <text x="154" y="98" font-family="Inter, sans-serif" font-size="9" font-weight="bold" fill="#0284c7" text-anchor="end">₹40 (20.5%)</text>

      <text x="12" y="114" font-family="Inter, sans-serif" font-size="9" fill="#334155">Retail Shelf:</text>
      <text x="154" y="114" font-family="Inter, sans-serif" font-size="9" font-weight="bold" fill="#7c3aed" text-anchor="end">₹35 (18.0%)</text>

      <line x1="12" y1="122" x2="154" y2="122" stroke="#e2e8f0" stroke-width="1" />
      <text x="12" y="134" font-family="Inter, sans-serif" font-size="9.5" font-weight="bold" fill="#0f172a">Final Shelf Price:</text>
      <text x="154" y="134" font-family="Inter, sans-serif" font-size="10.5" font-weight="extrabold" fill="#0f172a" text-anchor="end">₹195/kg</text>

      <!-- Traceability timeline preview in phone -->
      <g transform="translate(0, 154)">
        <circle cx="8" cy="8" r="5" fill="#10b981" />
        <line x1="8" y1="13" x2="8" y2="27" stroke="#10b981" stroke-width="1.5" />
        <circle cx="8" cy="32" r="5" fill="#0284c7" />
        <line x1="8" y1="37" x2="8" y2="51" stroke="#0284c7" stroke-width="1.5" />
        <circle cx="8" cy="56" r="5" fill="#7c3aed" />

        <text x="20" y="11" font-family="Inter, sans-serif" font-size="8.5" font-weight="bold" fill="#0f172a">Pawapuri Orchards, Ratnagiri</text>
        <text x="20" y="35" font-family="Inter, sans-serif" font-size="8.5" font-weight="bold" fill="#0f172a">Reefer Truck MH-4421 (11.8°C)</text>
        <text x="20" y="59" font-family="Inter, sans-serif" font-size="8.5" font-weight="bold" fill="#0f172a">FreshRoot Market Bandra</text>
      </g>
    </g>
  </g>
</svg>
